name: CI dan Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tes PHP dan build aset
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Siapkan Laravel
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: Jalankan tes
        run: php artisan test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build aset
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy manual ke VPS
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: e-rapor-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Siapkan koneksi SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ambil kode dan perbarui container
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/E-RAPOR-SLB-Insan-Mutiara"
          git fetch origin main
          git switch main || git switch -c main --track origin/main
          git pull --ff-only origin main
          test -f .env.docker
          sudo -n docker compose --env-file .env.docker config --quiet
          sudo -n docker compose --env-file .env.docker --parallel 1 build app web
          sudo -n docker compose --env-file .env.docker up -d --no-build
          sudo -n docker compose --env-file .env.docker exec -T app php artisan migrate --force
          sudo -n docker compose --env-file .env.docker exec -T app php artisan optimize
          curl --fail --silent --show-error --location --output /dev/null https://insanmutiara.my.id/login
          REMOTE
